name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows .msi / .exe'
        required: true
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS .dmg'
        required: true
        default: true
        type: boolean
      build_android:
        description: 'Build Android .apk'
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Windows Desktop Build (.msi / NSIS)
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Clean stale build artifacts
        shell: bash
        run: |
          rm -rf desktop/src-tauri/target/release/bundle/
          rm -f desktop/src-tauri/target/release/aion-desktop*

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Generate all icons (creates platform-specific icon formats for bundling)
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.iconset/icon_512x512@2x.png --output src-tauri/icons

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri app (Windows)
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Windows-updater
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: warn

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ============================================================================
  # macOS Desktop Build (.dmg)
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate macOS icon (.icns)
        working-directory: desktop/src-tauri/icons
        run: |
          if [ -d "icon.iconset" ]; then
            iconutil -c icns icon.iconset
            echo "Generated icon.icns"
          else
            echo "ERROR: icon.iconset directory not found"
            exit 1
          fi
          ls -la *.icns

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Clean stale build artifacts
        run: |
          rm -rf desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/
          rm -f desktop/src-tauri/target/aarch64-apple-darwin/release/aion-desktop*

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri app (macOS ARM64)
        working-directory: desktop
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS-updater
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: warn

      - name: Ad-hoc sign the app bundle
        run: |
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing $APP_PATH"
            codesign --force --deep -s - --entitlements desktop/src-tauri/entitlements.plist "$APP_PATH"
            echo "Verifying signature..."
            codesign -dvv "$APP_PATH" 2>&1 || true
          else
            echo "WARNING: No .app bundle found to sign"
          fi

      - name: Create signed DMG
        run: |
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            # Use git tag as version when available; fall back to tauri.conf.json
            REF="${{ github.ref_name }}"
            if [[ "$REF" == v* ]]; then
              VERSION="$REF"
            else
              VERSION="v$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")"
            fi
            DMG_NAME="${APP_NAME}_${VERSION}_aarch64.dmg"
            DMG_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
            mkdir -p "$DMG_DIR"

            # Create a temporary directory for DMG contents
            STAGE_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$STAGE_DIR/"
            ln -s /Applications "$STAGE_DIR/Applications"

            # Build the DMG
            hdiutil create -volname "$APP_NAME" \
              -srcfolder "$STAGE_DIR" \
              -ov -format UDZO \
              "$DMG_DIR/$DMG_NAME"

            rm -rf "$STAGE_DIR"
            echo "Created DMG: $DMG_DIR/$DMG_NAME"
            ls -la "$DMG_DIR/"
          fi

      - name: List build artifacts
        run: |
          echo "=== DMG files ==="
          find desktop/src-tauri/target -name "*.dmg" -type f 2>/dev/null || echo "No DMG found"
          echo "=== APP files ==="
          find desktop/src-tauri/target -name "*.app" -type d 2>/dev/null || echo "No APP found"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS-app
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # ============================================================================
  # Android Mobile Build (.apk)
  # ============================================================================
  build-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_android == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Create local.properties
        working-directory: mobile
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties
          cat android/local.properties

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (freezed, json_serializable, etc.)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release - production flavor)
        working-directory: mobile
        run: flutter build apk --release --flavor production --no-tree-shake-icons

      - name: Build APK (Split by ABI - production flavor)
        working-directory: mobile
        run: flutter build apk --release --flavor production --split-per-abi --no-tree-shake-icons

      - name: List APK artifacts
        run: |
          echo "=== APK files ==="
          find mobile/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-universal
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: warn

      - name: Upload ARM64 APK (Samsung S10 FE, Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-arm64-v8a
          path: mobile/build/app/outputs/flutter-apk/app-production-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload ARMv7 APK (Older devices)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-armeabi-v7a
          path: mobile/build/app/outputs/flutter-apk/app-production-armeabi-v7a-release.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK (Emulators)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-x86_64
          path: mobile/build/app/outputs/flutter-apk/app-production-x86_64-release.apk
          if-no-files-found: warn

  # ============================================================================
  # Create Release (on tag push)
  # ============================================================================
  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success') }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete existing release (if re-tagging)
        run: gh release delete ${{ github.ref_name }} --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f

      - name: Generate latest.json for Tauri updater
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"

          # Find signature files
          WIN_SIG=""
          MAC_SIG=""
          WIN_URL=""
          MAC_URL=""

          # Windows NSIS updater
          NSIS_ZIP=$(find artifacts -name "*.nsis.zip" -type f | head -1)
          NSIS_SIG=$(find artifacts -name "*.nsis.zip.sig" -type f | head -1)
          if [ -n "$NSIS_SIG" ] && [ -n "$NSIS_ZIP" ]; then
            WIN_SIG=$(cat "$NSIS_SIG")
            WIN_URL="${BASE_URL}/$(basename "$NSIS_ZIP")"
          fi

          # macOS updater
          MAC_TAR=$(find artifacts -name "*.app.tar.gz" -type f | head -1)
          MAC_SIG_FILE=$(find artifacts -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -n "$MAC_SIG_FILE" ] && [ -n "$MAC_TAR" ]; then
            MAC_SIG=$(cat "$MAC_SIG_FILE")
            MAC_URL="${BASE_URL}/$(basename "$MAC_TAR")"
          fi

          # Build latest.json — only include platforms that have valid signatures
          PLATFORMS=""
          if [ -n "$WIN_SIG" ] && [ -n "$WIN_URL" ]; then
            PLATFORMS="${PLATFORMS}\"windows-x86_64\": { \"signature\": \"${WIN_SIG}\", \"url\": \"${WIN_URL}\" }"
          fi
          if [ -n "$MAC_SIG" ] && [ -n "$MAC_URL" ]; then
            [ -n "$PLATFORMS" ] && PLATFORMS="${PLATFORMS}, "
            PLATFORMS="${PLATFORMS}\"darwin-aarch64\": { \"signature\": \"${MAC_SIG}\", \"url\": \"${MAC_URL}\" }"
          fi

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": { ${PLATFORMS} }
          }
          ENDJSON

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            ### macOS
            1. Download the `.dmg` file and open it
            2. Drag **Aion** to your Applications folder
            3. Before opening for the first time, run in Terminal:
               ```
               xattr -cr /Applications/Aion.app
               ```
            4. Open Aion from Applications

            ### Windows
            Download and run the `.msi` installer or the `.exe` (NSIS) installer.

            ### Android
            Download the `.apk` file and install it on your device (enable "Install from unknown sources" if prompted).

            ### In-App Updates
            Once installed, use **Settings > Check for Updates** to update automatically.
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk
            artifacts/**/*.nsis.zip
            artifacts/**/*.nsis.zip.sig
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
