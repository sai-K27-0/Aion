name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS .dmg'
        required: true
        default: true
        type: boolean
      build_android:
        description: 'Build Android .apk'
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # macOS Desktop Build (.dmg)
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust targets for universal binary
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (Universal macOS)
        working-directory: desktop
        run: npm run tauri:build:macos

      - name: List build artifacts
        run: |
          echo "=== DMG files ==="
          find desktop/src-tauri/target -name "*.dmg" -type f 2>/dev/null || echo "No DMG found"
          echo "=== APP files ==="
          find desktop/src-tauri/target -name "*.app" -type d 2>/dev/null || echo "No APP found"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS-universal
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS-app
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  # ============================================================================
  # Android Mobile Build (.apk)
  # ============================================================================
  build-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (freezed, json_serializable, etc.)
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release - All ABIs)
        working-directory: mobile
        run: flutter build apk --release

      - name: Build APK (Release - Split by ABI)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: List APK artifacts
        run: |
          echo "=== APK files ==="
          find mobile/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-universal
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload ARM64 APK (Samsung S10 FE, Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-arm64-v8a
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload ARMv7 APK (Older devices)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-armeabi-v7a
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK (Emulators)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-x86_64
          path: mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn

  # ============================================================================
  # Create Release (on tag push)
  # ============================================================================
  create-release:
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
