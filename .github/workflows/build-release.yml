name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows .msi / .exe'
        required: true
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS .dmg'
        required: true
        default: true
        type: boolean
      build_android:
        description: 'Build Android .apk'
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Windows Desktop Build (.msi / NSIS)
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri app (Windows)
        working-directory: desktop
        run: npm run tauri build

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ============================================================================
  # macOS Desktop Build (.dmg)
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate macOS icon (.icns)
        working-directory: desktop/src-tauri/icons
        run: |
          if [ -d "icon.iconset" ]; then
            iconutil -c icns icon.iconset
            echo "Generated icon.icns"
          fi
          ls -la *.icns 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri app (macOS ARM64)
        working-directory: desktop
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: List build artifacts
        run: |
          echo "=== DMG files ==="
          find desktop/src-tauri/target -name "*.dmg" -type f 2>/dev/null || echo "No DMG found"
          echo "=== APP files ==="
          find desktop/src-tauri/target -name "*.app" -type d 2>/dev/null || echo "No APP found"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aion-macOS-app
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # ============================================================================
  # Android Mobile Build (.apk)
  # ============================================================================
  build-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_android == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Create local.properties
        working-directory: mobile
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties
          cat android/local.properties

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (freezed, json_serializable, etc.)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build APK (Release - production flavor)
        working-directory: mobile
        run: flutter build apk --release --flavor production --no-tree-shake-icons

      - name: Build APK (Split by ABI - production flavor)
        working-directory: mobile
        run: flutter build apk --release --flavor production --split-per-abi --no-tree-shake-icons

      - name: List APK artifacts
        run: |
          echo "=== APK files ==="
          find mobile/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-universal
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: warn

      - name: Upload ARM64 APK (Samsung S10 FE, Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-arm64-v8a
          path: mobile/build/app/outputs/flutter-apk/app-production-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload ARMv7 APK (Older devices)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-armeabi-v7a
          path: mobile/build/app/outputs/flutter-apk/app-production-armeabi-v7a-release.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK (Emulators)
        uses: actions/upload-artifact@v4
        with:
          name: Aion-Android-x86_64
          path: mobile/build/app/outputs/flutter-apk/app-production-x86_64-release.apk
          if-no-files-found: warn

  # ============================================================================
  # Create Release (on tag push)
  # ============================================================================
  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
