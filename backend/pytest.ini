[pytest]
# Run async tests automatically without requiring the @pytest.mark.asyncio decorator
# on every single test. Tests that need the marker for strict mode still work fine.
asyncio_mode = auto

# Silence the pytest-asyncio "asyncio_default_fixture_loop_scope not set" warning
asyncio_default_fixture_loop_scope = function

# Suppress live log output during tests (set to true to see logs while tests run)
log_cli = false
