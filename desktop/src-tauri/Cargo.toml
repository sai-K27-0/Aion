[package]
name = "aion-desktop"
version = "0.5.0"
description = "Aion Desktop Client - AI-Powered Life Management"
authors = ["Aion Project"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


# Screen capture
screenshots = "0.8"
image = "0.24"
base64 = "0.21"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Ollama proxy (avoids CORS in webview)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Secure storage (OS keychain)
keyring = "2"

# Hardware detection (RAM, CPU, GPU, disk)
sysinfo = "0.32"

# Native window blur/vibrancy effects
window-vibrancy = "0.5"

# Platform-specific active window detection
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
