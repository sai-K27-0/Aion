<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#0F1120"/>
    </radialGradient>
    <!-- Triangle face gradients -->
    <linearGradient id="face1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BA3E6"/>
      <stop offset="100%" stop-color="#3A7BC8"/>
    </linearGradient>
    <linearGradient id="face2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="face3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2A5FA0"/>
      <stop offset="100%" stop-color="#3A7BC8"/>
    </linearGradient>
    <linearGradient id="face4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E4B80"/>
      <stop offset="100%" stop-color="#2A5FA0"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge highlight -->
    <filter id="edgeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle glow behind triangle -->
  <circle cx="256" cy="270" r="160" fill="url(#glow)"/>

  <!-- Main triangle - faceted/low-poly with 4 faces -->
  <!-- Center point for facets: approximately 256, 280 -->

  <!-- Left face (darkest) -->
  <polygon points="256,80 136,400 256,320" fill="url(#face4)" opacity="0.95"/>

  <!-- Right face (medium-dark) -->
  <polygon points="256,80 376,400 256,320" fill="url(#face3)" opacity="0.95"/>

  <!-- Bottom-left face (bright) -->
  <polygon points="136,400 256,320 196,400" fill="url(#face1)" opacity="0.95"/>

  <!-- Bottom-right face (brightest - cyan) -->
  <polygon points="376,400 256,320 316,400" fill="url(#face2)" opacity="0.95"/>

  <!-- Facet edge lines (subtle) -->
  <line x1="256" y1="80" x2="256" y2="320" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="136" y1="400" x2="256" y2="320" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <line x1="376" y1="400" x2="256" y2="320" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <line x1="196" y1="400" x2="256" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <line x1="316" y1="400" x2="256" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Outer triangle edge highlight -->
  <polygon points="256,80 136,400 376,400" fill="none" stroke="rgba(0,217,255,0.25)" stroke-width="1.5"/>

  <!-- Top vertex bright point -->
  <circle cx="256" cy="80" r="3" fill="#00D9FF" opacity="0.8"/>
</svg>
